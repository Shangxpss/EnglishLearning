[package]
name = "sentence-video"
version = "0.1.0"
edition = "2021"
description = "Sentence-Segmented Video Player (pure Rust, single executable)"
license = "Apache-2.0"
default-run = "sentence-video"

[[bin]]
name = "sentence-video"
path = "src/main.rs"

[features]
# Speech-to-text is built in by default so the shipped binary needs no
# installs and no downloads: whisper.cpp is compiled and statically linked by
# `whisper-rs-sys` (which vendors the C++ source), and the model is embedded.
# Use `--no-default-features` for a fast, model-free build.
#
# `agent` is the CopilotKit/AG-UI service — the Rust port of `AI-Demo/agent-runtime`
# (Bun) and `AI-Demo/backend` (Python). It is on by default so one binary serves
# both the media player and the agent, matching the single-executable goal.
# Drop it with `--no-default-features --features asr-whisper` when only the
# media player is needed (this also removes tokio/axum/reqwest).
default = ["asr-whisper", "agent"]
asr-whisper = ["dep:whisper-rs"]
# wav2vec2 CTC forced alignment (`sentence-video align`). OFF by default, and
# deliberately empty: the model is hand-written in `src/align/`, so enabling it
# adds no dependencies — the single-executable promise is untouched. It does
# however need ~378 MB of weights on disk at runtime (they are far too large to
# embed), so it is not part of the default build.
asr-align = []
agent = [
    "dep:ag-ui",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:reqwest",
    "dep:futures-util",
    "dep:async-stream",
]

[dependencies]
# `build` statically compiles & embeds FFmpeg from source, so the produced
# binary needs NO system FFmpeg installed on the target machine.
ffmpeg-next = { version = "6", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles the SQLite amalgamation into the binary, so no system
# libsqlite3 is required (matching the single-executable goal).
rusqlite = { version = "0.32", features = ["bundled"] }
# Optional: builds whisper.cpp from the vendored source (needs `cmake` on the
# BUILD machine only) and links it statically.
whisper-rs = { version = "0.16.0", optional = true }

# ── agent service (feature "agent") ──────────────────────────────────────────
# Replaces `@copilotkit/runtime` (Bun) and FastAPI + LangGraph (Python).
#
# `ag-ui` is the AG-UI protocol SDK: it owns the event vocabulary (all 36 event
# types), the SSE framing, the `Agent` trait / `RunContext` hosting runtime, the
# request type and the axum mount. This crate supplies only what the SDK
# deliberately leaves out: the model client, the tool runtime and the A2UI
# payloads. Its `axum` feature is the only one that pulls in tokio.
ag-ui = { version = "0.4", optional = true, features = ["axum"] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
] }
tower-http = { version = "0.6", optional = true, features = ["cors"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
[profile.release]
opt-level = 3
lto = true
strip = true

# The wav2vec2 forced-alignment forward pass is hand-written in this crate
# (`align/`, enabled by `--features asr-align`) and is the dominant cost of
# building a session: on a 60 s clip, two 30 s windows took ~3 min with
# `--release` and were still running after 18 min in the debug profile. The dev
# server runs the debug profile, so alignment was effectively unusable there.
#
# Scoped to this package on purpose: no dependency (FFmpeg, whisper.cpp, SQLite)
# changes profile, so nothing else is recompiled and — because the aligner is
# pure Rust with no dependencies — the entire hot path is still optimized.
[profile.dev.package.sentence-video]
opt-level = 3
