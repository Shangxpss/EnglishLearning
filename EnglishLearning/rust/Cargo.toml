[package]
name = "sentence-video"
version = "0.1.0"
edition = "2021"
description = "Sentence-Segmented Video Player (pure Rust, single executable)"
license = "Apache-2.0"
default-run = "sentence-video"

[[bin]]
name = "sentence-video"
path = "src/main.rs"

[features]
# Speech-to-text is built in by default so the shipped binary needs no
# installs and no downloads: whisper.cpp is compiled and statically linked by
# `whisper-rs-sys` (which vendors the C++ source), and the model is embedded.
# Use `--no-default-features` for a fast, model-free build.
default = ["asr-whisper"]
asr-whisper = ["dep:whisper-rs"]

[dependencies]
# `build` statically compiles & embeds FFmpeg from source, so the produced
# binary needs NO system FFmpeg installed on the target machine.
ffmpeg-next = { version = "6", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles the SQLite amalgamation into the binary, so no system
# libsqlite3 is required (matching the single-executable goal).
rusqlite = { version = "0.32", features = ["bundled"] }
# Optional: builds whisper.cpp from the vendored source (needs `cmake` on the
# BUILD machine only) and links it statically.
whisper-rs = { version = "0.16.0", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
